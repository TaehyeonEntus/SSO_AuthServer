<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auth Server - 회원가입</title>
    <link href="/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            position: relative;
        }
        .main-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }
        .register-card {
            background: rgba(255, 255, 255, 0.95);
            border: none;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
            overflow: hidden;
            width: 100%;
            max-width: 600px;
            animation: fadeIn 0.5s ease;
        }
        .card-header {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            padding: 2.5rem 2rem;
            text-align: center;
        }
        .card-header h2 {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }
        .card-header p {
            font-size: 1rem;
            margin-bottom: 0;
        }
        .form-control {
            border-radius: 12px;
            border: 2px solid #e9ecef;
            padding: 1rem 1.2rem;
            font-size: 1rem;
            transition: all 0.3s ease;
        }
        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.25rem rgba(102, 126, 234, 0.25);
        }
        .form-control.is-invalid { border-color: #dc3545; }
        .form-control.is-valid { border-color: #28a745; }
        .form-label { font-weight: 600; font-size: 0.95rem; margin-bottom: 0.5rem; color: #495057; }
        .btn-primary, .btn-secondary {
            border-radius: 12px;
            padding: 1rem 2rem;
            font-weight: 600;
            font-size: 1rem;
            min-height: 50px;
            transition: all 0.3s ease;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn-primary {
            background: linear-gradient(45deg, #667eea, #764ba2);
            border: none;
            color: white;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.3);
        }
        .btn-secondary {
            background: #6c757d;
            border: none;
            color: white;
            text-decoration: none;
        }
        .btn-secondary:hover {
            background: #5a6268;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(108, 117, 125, 0.3);
        }
        .error-msg { color: #dc3545; font-size: 0.875rem; margin-top: 0.5rem; display: block; }
        .loading { opacity: 0.7; pointer-events: none; }
        .password-strength { margin-top: 0.5rem; }
        .strength-bar { height: 6px; border-radius: 3px; background: #e9ecef; overflow: hidden; }
        .strength-fill { height: 100%; transition: all 0.3s ease; width: 0%; }
        .strength-weak { background: #dc3545; width: 25%; }
        .strength-fair { background: #ffc107; width: 50%; }
        .strength-good { background: #17a2b8; width: 75%; }
        .strength-strong { background: #28a745; width: 100%; }
        .floating-shapes {
            position: absolute; width: 100%; height: 100%; overflow: hidden; z-index: -1;
        }
        .shape {
            position: absolute;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            animation: float 6s ease-in-out infinite;
        }
        .shape:nth-child(1) { width: 120px; height: 120px; top: 10%; left: 15%; animation-delay: 0s; }
        .shape:nth-child(2) { width: 80px; height: 80px; top: 70%; right: 20%; animation-delay: 2s; }
        .shape:nth-child(3) { width: 150px; height: 150px; top: 50%; left: 75%; animation-delay: 4s; }
        .shape:nth-child(4) { width: 90px; height: 90px; top: 25%; right: 45%; animation-delay: 1s; }

        @keyframes float {
            0%,100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }
        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(-20px); }
            100% { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="floating-shapes">
    <div class="shape"></div>
    <div class="shape"></div>
    <div class="shape"></div>
    <div class="shape"></div>
</div>

<div class="container main-container">
    <div class="register-card">
        <div class="card-header">
            <h2 class="mb-0"><i class="fas fa-user-plus me-2"></i>계정 생성</h2>
            <p class="mb-0 mt-2 opacity-75">새 계정을 만들어 시작하세요</p>
        </div>
        <div class="card-body p-5">
            <form id="registerForm">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label for="username" class="form-label"><i class="fas fa-user me-2"></i>아이디</label>
                        <input type="text" class="form-control" id="username" name="username" placeholder="아이디를 입력하세요">
                        <div id="usernameError" class="error-msg"></div>
                    </div>
                    <div class="col-md-6">
                        <label for="name" class="form-label"><i class="fas fa-id-badge me-2"></i>닉네임</label>
                        <input type="text" class="form-control" id="name" name="name" placeholder="닉네임을 입력하세요">
                        <div id="nameError" class="error-msg"></div>
                    </div>
                </div>

                <div class="mb-4 mt-3">
                    <label for="password" class="form-label"><i class="fas fa-lock me-2"></i>비밀번호</label>
                    <input type="password" class="form-control" id="password" name="password" placeholder="비밀번호를 입력하세요">
                    <div class="password-strength mt-2">
                        <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
                        <small class="text-muted mt-1 d-block" id="strengthText">비밀번호 강도를 확인하세요</small>
                    </div>
                    <div id="passwordError" class="error-msg"></div>
                </div>

                <div class="mb-4">
                    <label for="passwordConfirm" class="form-label"><i class="fas fa-check-circle me-2"></i>비밀번호 확인</label>
                    <input type="password" class="form-control" id="passwordConfirm" name="passwordConfirm" placeholder="비밀번호를 다시 입력하세요">
                    <div id="passwordConfirmError" class="error-msg"></div>
                </div>

                <div class="d-grid gap-3 mt-4">
                    <button type="submit" class="btn btn-primary" id="registerBtn"><i class="fas fa-user-plus me-2"></i>회원가입</button>
                    <a href="/login" class="btn btn-secondary"><i class="fas fa-arrow-left me-2"></i>로그인으로 돌아가기</a>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="/js/bootstrap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/js/all.min.js"></script>
<script type="module">
    import { getData } from "/js/api.js";

    class RegisterHandler {
        constructor() {
            this.form = document.getElementById('registerForm');
            this.usernameInput = document.getElementById('username');
            this.passwordInput = document.getElementById('password');
            this.passwordConfirmInput = document.getElementById('passwordConfirm');
            this.nameInput = document.getElementById('name');
            this.usernameErrorDiv = document.getElementById('usernameError');
            this.passwordErrorDiv = document.getElementById('passwordError');
            this.passwordConfirmErrorDiv = document.getElementById('passwordConfirmError');
            this.nameErrorDiv = document.getElementById('nameError');
            this.registerBtn = document.getElementById('registerBtn');
            this.strengthFill = document.getElementById('strengthFill');
            this.strengthText = document.getElementById('strengthText');
            this.initEventListeners();
        }

        initEventListeners() {
            this.form.addEventListener('submit', (e) => this.handleSubmit(e));
            this.passwordInput.addEventListener('input', () => this.checkPasswordStrength());
            this.passwordConfirmInput.addEventListener('input', () => this.checkPasswordMatch());
        }

        checkPasswordStrength() {
            const password = this.passwordInput.value;
            let strength = 0;
            if (password.length >= 8) strength++;
            if (/[a-z]/.test(password)) strength++;
            if (/[A-Z]/.test(password)) strength++;
            if (/\d/.test(password)) strength++;
            if (/[^A-Za-z0-9]/.test(password)) strength++;

            let text = '', cls = '';
            switch(strength) {
                case 0:
                case 1: text='매우 약함'; cls='strength-weak'; break;
                case 2: text='약함'; cls='strength-weak'; break;
                case 3: text='보통'; cls='strength-fair'; break;
                case 4: text='강함'; cls='strength-good'; break;
                case 5: text='매우 강함'; cls='strength-strong'; break;
            }
            this.strengthFill.className = `strength-fill ${cls}`;
            this.strengthText.textContent = text;
        }

        checkPasswordMatch() {
            const password = this.passwordInput.value;
            const confirm = this.passwordConfirmInput.value;
            if (confirm && password !== confirm) {
                this.passwordConfirmInput.classList.add('is-invalid');
                this.passwordConfirmInput.classList.remove('is-valid');
            } else if (confirm && password === confirm) {
                this.passwordConfirmInput.classList.add('is-valid');
                this.passwordConfirmInput.classList.remove('is-invalid');
            } else {
                this.passwordConfirmInput.classList.remove('is-invalid','is-valid');
            }
        }

        async handleSubmit(e) {
            e.preventDefault();
            const data = {
                username: this.usernameInput.value.trim(),
                password: this.passwordInput.value,
                passwordConfirm: this.passwordConfirmInput.value,
                name: this.nameInput.value.trim()
            };
            this.clearErrors();
            this.setLoading(true);
            try {
                const response = await fetch('/register',{
                    method:'POST',
                    headers:{'Content-Type':'application/json','Accept':'application/json'},
                    body:JSON.stringify(data)
                });

                if(response.ok){
                    // 바로 로그인 페이지로 이동
                    window.location.href = '/login';
                    return;
                }

                if(response.status===400){
                    const errors = await response.json();
                    this.displayValidationErrors(errors);
                } else {
                    this.showErrorToast('회원가입 실패: 서버 오류');
                }
            } catch(err){
                console.error(err);
                this.showErrorToast('회원가입 중 오류 발생');
            } finally {
                this.setLoading(false);
            }
        }


        displayValidationErrors(errors){
            if(errors.username){ this.usernameErrorDiv.textContent=errors.username; this.usernameInput.classList.add('is-invalid'); }
            if(errors.password){ this.passwordErrorDiv.textContent=errors.password; this.passwordInput.classList.add('is-invalid'); }
            if(errors.passwordConfirm){ this.passwordConfirmErrorDiv.textContent=errors.passwordConfirm; this.passwordConfirmInput.classList.add('is-invalid'); }
            if(errors.name){ this.nameErrorDiv.textContent=errors.name; this.nameInput.classList.add('is-invalid'); }
        }

        clearErrors(){
            [this.usernameErrorDiv,this.passwordErrorDiv,this.passwordConfirmErrorDiv,this.nameErrorDiv].forEach(div=>div.textContent='');
            [this.usernameInput,this.passwordInput,this.passwordConfirmInput,this.nameInput].forEach(input=>input.classList.remove('is-invalid','is-valid'));
        }

        setLoading(isLoading){
            if(isLoading){ this.registerBtn.innerHTML='<i class="fas fa-spinner fa-spin me-2"></i>가입 중...'; this.registerBtn.disabled=true; this.form.classList.add('loading'); }
            else{ this.registerBtn.innerHTML='<i class="fas fa-user-plus me-2"></i>회원가입'; this.registerBtn.disabled=false; this.form.classList.remove('loading'); }
        }

        showErrorToast(message){
            const toast=document.createElement('div');
            toast.className='position-fixed top-0 end-0 p-3'; toast.style.zIndex='1050';
            toast.innerHTML=`<div class="toast show" role="alert">
                <div class="toast-header bg-danger text-white"><i class="fas fa-exclamation-circle me-2"></i><strong class="me-auto">오류</strong></div>
                <div class="toast-body">${message}</div>
            </div>`;
            document.body.appendChild(toast);
            setTimeout(()=>{toast.remove();},3000);
        }
    }

    document.addEventListener('DOMContentLoaded',()=>{ new RegisterHandler(); });
</script>
</body>
</html>
